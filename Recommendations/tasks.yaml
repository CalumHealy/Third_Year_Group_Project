research_task:
  description: >
    Conduct a thorough research about past and current prices of the given stock or cryptocurrency.  
    Analyze these prices and try to make a prediction about future changes, and based on that prediction make a recommendation on whether somebody should buy or sell the asset. 
    The current year is 2024. Try to get prices up to today.
  expected_output: >
    A string with the name of the asset and a buy/sell/hold recommendation.
  agent: researcher

formatting_task: 
  description: >
    Format the researcher's data in a consistent and readable way, and output the data as a string. Make sure not to include any unnecessary information. Include just the asset name and the recommendation.
#    Make sure to include every stock and crypto in the researcher's list.
  expected_output: >
    A string containing the name of the asset, the buy/sell/hold recommendation, a newline character at the end, and nothing else. For example:
    Bitcoin: Buy\n
    {name}: {recommendation}\n
  agent: formatter