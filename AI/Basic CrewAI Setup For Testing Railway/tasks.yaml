research_task:
  description: >
    Conduct a thorough research about past and current major stock and crypto prices. 
    Make sure you show general trends in prices which may indicate probable future changes. 
    The current year is 2024. 
  expected_output: >
    A list of eight stocks and cryptocurrencies (four of each) with their current prices, and their prices at certain points throughout history, showing the dates. 
  agent: researcher

formatting_task: 
  description: >
    Format the researcher's data in a consistent and readable way, and output the data to a text file. 
  expected_output: >
    A text file named prices.txt containing the researcher's data, but formatted as below: 
    Bitcoin
    1/4/2016,127.83
    17/2/2018,642.50
    2/12/2023,1034.86
    NVIDIA
    4/5/2014,34.76
    8/5/2019,295.38
    6/11/2024,530.84
  agent: formatter