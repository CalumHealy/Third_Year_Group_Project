research_task:
  description: >
    Conduct a thorough research about past and current prices of the given stock or cryptocurrency.  
    Make sure you show general trends in prices which may indicate probable future changes. If you cannot find data for a stock/crypto, save it's name but put an X in place of the price. 
    The current year is 2024. Try to get prices up to today.
  expected_output: >
    A string with the name of the stock/cryptocurrency, followed by the prices and dates that those prices were recorded on.
  agent: researcher

formatting_task: 
  description: >
    Format the researcher's data in a consistent and readable way, and output the data as a string.
#    Make sure to include every stock and crypto in the researcher's list.
  expected_output: >
    A string containing the name of the stock/cryptocurrency and the prices through history, and a date with each price, and a newline character at the end. For example:
    Bitcoin: 2/2018,200 4/2018,400 1/2020,6000 9/2020,7000 4/2024,90000
    {name}: {date},{price} {date},{price} {date},{price} {date},{price}\n
  agent: formatter